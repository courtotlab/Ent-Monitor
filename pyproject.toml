[project]
name = "ent-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apify>=3.4.1",
    "beautifulsoup4>=4.15.0",
    "duckduckgo-search>=8.0.0",
    "hdbscan>=0.8.40",
    "langchain-openai>=0.3.0",
    "langdetect>=1.0.9",
    "langgraph>=0.4.0",
    "numba>=0.61.0",
    "numpy>=2.0.0",
    "openai>=1.60.0",
    "pandas>=3.0.3",
    "praw",
    "psycopg2-binary>=2.9.10",
    "python-dotenv",
    "requests>=2.34.2",
    "scikit-learn>=1.6.0",
    "sentence-transformers>=3.0.0",
    "spacy>=3.8.14",
    "trendspyg>=0.6.1",
    "umap-learn>=0.5.7",
]


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"

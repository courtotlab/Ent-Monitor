services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ent-surveillance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ent_admin
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: ent_surveillance
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ent_admin -d ent_surveillance"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: ent-surveillance-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

